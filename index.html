<title>Istituti scolastici italiani — estrazione e modifica</title>
<style>
  :root { --bd: #d0d5dd; --bg: #f7f8fa; --accent: #2563eb; --muted: #667085; }
  * { box-sizing: border-box; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; color: #101828; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--bd); }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end;
         padding: 12px 18px; border-bottom: 1px solid var(--bd); }
  .bar.gen { background: var(--bg); box-shadow: 0 1px 3px rgba(16, 24, 40, .06); }
  /* stacco netto tra "Genera" e l'area filtri+tabella */
  .split { height: 12px; background: #e9edf2; border-top: 1px solid var(--bd); border-bottom: 1px solid var(--bd); }
  .bar > .tag { align-self: center; font-size: 11px; font-weight: 700; text-transform: uppercase;
                color: var(--muted); letter-spacing: .04em; }
  .f { display: flex; flex-direction: column; gap: 5px; }
  .f .cap { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); }
  .bar input[type=text], .bar select { height: 34px; min-width: 130px; padding: 0 9px;
         border: 1px solid var(--bd); border-radius: 6px; font: inherit; background: #fff; }
  #search { min-width: 260px; }
  .row { display: flex; align-items: center; gap: 16px; height: 34px; }
  .row label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: #344054;
               white-space: nowrap; cursor: pointer; }
  .hint { color: var(--muted); }
  #genera, #salva { margin-left: auto; }
  button { height: 34px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--accent);
           color: #fff; font-weight: 600; cursor: pointer; }
  button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #status { padding: 6px 18px; color: var(--muted); font-size: 12px; min-height: 16px; }
  .wrap { overflow: auto; max-height: calc(100vh - 250px); border-top: 1px solid var(--bd); }
  table { border-collapse: collapse; width: 100%; }
  th { position: sticky; top: 0; background: #eef1f5; text-align: left; padding: 7px 8px;
       font-size: 11px; text-transform: uppercase; color: #475467; white-space: nowrap;
       cursor: pointer; user-select: none; border-bottom: 1px solid var(--bd); }
  th:hover { background: #e5e9ef; }
  td { border-bottom: 1px solid #eef0f3; padding: 0; }
  td.c-bool { text-align: center; padding: 4px; min-width: 90px; }
  td input[type=text], td select { width: 100%; border: 0; padding: 6px 9px;
       background: transparent; font: inherit; color: inherit; }
  td select { cursor: pointer; }
  td input:focus, td select:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: #fff; }
  /* larghezze per colonna: tabella più larga, scroll orizzontale */
  td > input[type=text], td > select { min-width: 150px; }
  td[data-k="denominazione"] > input[type=text], td[data-k="indirizzo"] > input[type=text],
  td[data-k="istituto_riferimento"] > input[type=text] { min-width: 340px; }
  td[data-k="grado"] > input[type=text] { min-width: 280px; }
  td[data-k="comune"] > input[type=text], td[data-k="email"] > input[type=text],
  td[data-k="sito_web"] > input[type=text] { min-width: 230px; }
  td[data-k="provincia"] > input[type=text] { min-width: 170px; }
  td[data-k="regione"] > select, td[data-k="livello"] > select { min-width: 170px; }
</style>

<header>
  <h1>Istituti scolastici italiani</h1>
  <p>Dati ufficiali del Ministero (dati.istruzione.it). Genera l'estrazione, filtra e ordina, modifica in tabella, salva.</p>
</header>

<!-- opzioni di ESTRAZIONE (lato server: cosa scaricare) -->
<div class="bar gen">
  <span class="tag">Genera</span>
  <div class="f">
    <span class="cap">Sorgenti</span>
    <div class="row">
      <label><input type="checkbox" id="statali" checked> statali</label>
      <label><input type="checkbox" id="paritarie" checked> paritarie</label>
    </div>
  </div>
  <div class="f">
    <span class="cap">Regione</span>
    <select id="regione"><option value="">Tutte</option></select>
  </div>
  <div class="f">
    <span class="cap">Provincia</span>
    <input type="text" id="provincia" placeholder="es. ANCONA">
  </div>
  <div class="f">
    <span class="cap">Livello</span>
    <select id="livello"></select>
  </div>
  <div class="f">
    <span class="cap">Opzioni</span>
    <div class="row">
      <label><input type="checkbox" id="geocode"> geocoding <span class="hint">(lat/lon, lento)</span></label>
    </div>
  </div>
  <button id="genera">Genera</button>
</div>

<div class="split"></div>

<!-- FILTRI tabella (lato client: sui dati già caricati) -->
<div class="bar">
  <span class="tag">Filtra</span>
  <div class="f">
    <span class="cap">Cerca</span>
    <input type="text" id="search" placeholder="Cerca in tabella…">
  </div>
  <div class="f">
    <span class="cap">Regione</span>
    <select id="fRegione"><option value="">Tutte</option></select>
  </div>
  <div class="f">
    <span class="cap">Provincia</span>
    <select id="fProvincia"><option value="">Tutte</option></select>
  </div>
  <div class="f">
    <span class="cap">Livello</span>
    <select id="fLivello"><option value="">Tutti</option></select>
  </div>
  <div class="f">
    <span class="cap">Tipo</span>
    <select id="fTipo">
      <option value="">Tutti</option>
      <option value="statali">Statali</option>
      <option value="paritarie">Paritarie</option>
    </select>
  </div>
  <div class="f">
    <span class="cap">Colonne</span>
    <div class="row"><label><input type="checkbox" id="colonne"> tutte</label></div>
  </div>
  <button class="ghost" id="salva" disabled>Salva nel JSON</button>
</div>

<div id="status"></div>
<div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

<script>
const REGIONI = ["ABRUZZO","BASILICATA","CALABRIA","CAMPANIA","EMILIA ROMAGNA","FRIULI VENEZIA GIULIA",
  "LAZIO","LIGURIA","LOMBARDIA","MARCHE","MOLISE","PIEMONTE","PUGLIA","SARDEGNA","SICILIA","TOSCANA",
  "UMBRIA","VENETO"];
const LIVELLI = [["","Tutti"],["infanzia","Infanzia"],["primaria","Primaria"],
  ["secondaria-i","Secondaria I grado"],["secondaria-ii","Secondaria II grado (superiori)"],
  ["comprensivo","Istituto comprensivo"],["altro","Altro (CPIA, convitti…)"]];
const LIV_LABEL = Object.fromEntries(LIVELLI.map(([v, l]) => [v, l]));
// enum modificabili nelle celle (valori = grafie reali del dato MIUR)
const LIV_OPTS = LIVELLI.filter(([v]) => v);
const REGIONI_DATA = ["ABRUZZO","BASILICATA","CALABRIA","CAMPANIA","EMILIA ROMAGNA","FRIULI-VENEZIA G.",
  "LAZIO","LIGURIA","LOMBARDIA","MARCHE","MOLISE","PIEMONTE","PUGLIA","SARDEGNA","SICILIA","TOSCANA","UMBRIA","VENETO"]
  .map(r => [r, r]);

// colonne curate (extra: nascoste finché non si spunta "tutte le colonne")
const COLUMNS = [
  { k: "denominazione", label: "Denominazione", wide: true },
  { k: "livello", label: "Livello", enum: LIV_OPTS },
  { k: "grado", label: "Grado" },
  { k: "comune", label: "Comune" },
  { k: "provincia", label: "Provincia" },
  { k: "regione", label: "Regione", enum: REGIONI_DATA },
  { k: "indirizzo", label: "Indirizzo", wide: true },
  { k: "cap", label: "CAP" },
  { k: "email", label: "Email" },
  { k: "sito_web", label: "Sito web" },
  { k: "paritaria", label: "Paritaria", bool: true },
  { k: "codice", label: "Codice" },
  { k: "lat", label: "Lat" }, { k: "lon", label: "Lon" },
  { k: "pec", label: "PEC", extra: true },
  { k: "codice_comune", label: "Cod. comune", extra: true },
  { k: "area", label: "Area", extra: true },
  { k: "caratteristica", label: "Caratteristica", extra: true },
  { k: "codice_istituto_riferimento", label: "Cod. ist. rif.", extra: true },
  { k: "istituto_riferimento", label: "Istituto riferimento", extra: true, wide: true },
  { k: "anno_scolastico", label: "A.S.", extra: true },
];
const MAX_ROWS = 1000;
const $ = (id) => document.getElementById(id);
const attr = (v) => String(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;");

let data = [];
let showExtra = false;
let sortKey = null, sortDir = 1;

// popola i due select statici
REGIONI.forEach(r => $("regione").add(new Option(r, r)));
LIVELLI.forEach(([v, l]) => $("livello").add(new Option(l, v)));

const setStatus = (m) => { $("status").textContent = m; };
const has = (k) => data.length > 0 && k in data[0];

function visibleCols() {
  return COLUMNS.filter(c => (showExtra || !c.extra) && has(c.k));
}

function fillFilter(sel, values, labeler) {
  const keep = sel.value;
  sel.length = 1;                                  // lascia la prima opzione ("Tutte/Tutti")
  values.forEach(v => sel.add(new Option(labeler ? labeler(v) : v, v)));
  sel.value = values.includes(keep) ? keep : "";
}

function distinct(k) {
  return [...new Set(data.map(r => r[k]).filter(v => v != null))]
    .sort((a, b) => String(a).localeCompare(String(b), "it"));
}

function refreshFilters() {
  fillFilter($("fRegione"), distinct("regione"));
  fillFilter($("fProvincia"), distinct("provincia"));
  fillFilter($("fLivello"), distinct("livello"), v => LIV_LABEL[v] || v);
}

function filteredIndices() {
  const q = $("search").value.trim().toLowerCase();
  const fr = $("fRegione").value, fp = $("fProvincia").value, fl = $("fLivello").value, ft = $("fTipo").value;
  const out = [];
  for (let i = 0; i < data.length; i++) {
    const r = data[i];
    if (fr && r.regione !== fr) continue;
    if (fp && r.provincia !== fp) continue;
    if (fl && r.livello !== fl) continue;
    if (ft === "statali" && r.paritaria) continue;
    if (ft === "paritarie" && !r.paritaria) continue;
    if (q && !JSON.stringify(r).toLowerCase().includes(q)) continue;
    out.push(i);
  }
  return out;
}

function sortIndices(idx) {
  if (!sortKey) return idx;
  return idx.sort((a, b) => {
    const va = data[a][sortKey], vb = data[b][sortKey];
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return String(va).localeCompare(String(vb), "it", { numeric: true }) * sortDir;
  });
}

function cell(i, c) {
  const v = data[i][c.k];
  if (c.bool)
    return `<td data-k="${c.k}" class="c-bool"><input type="checkbox" data-i="${i}" data-c="${c.k}"${v ? " checked" : ""}></td>`;
  if (c.enum) {
    const cur = v == null ? "" : String(v);
    const opts = c.enum.map(([ov, ol]) =>
      `<option value="${attr(String(ov))}"${cur === String(ov) ? " selected" : ""}>${attr(ol)}</option>`).join("");
    return `<td data-k="${c.k}"><select data-i="${i}" data-c="${attr(c.k)}">${opts}</select></td>`;
  }
  return `<td data-k="${c.k}"><input type="text" data-i="${i}" data-c="${attr(c.k)}" value="${v == null ? "" : attr(v)}"></td>`;
}

function render() {
  const cols = visibleCols();
  $("thead").innerHTML = "<tr>" + cols.map(c =>
    `<th data-k="${c.k}">${c.label}${sortKey === c.k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`
  ).join("") + "</tr>";

  let idx = sortIndices(filteredIndices());
  const nFiltered = idx.length;
  idx = idx.slice(0, MAX_ROWS);
  $("tbody").innerHTML = idx.map(i => "<tr>" + cols.map(c => cell(i, c)).join("") + "</tr>").join("");

  const parts = [`${nFiltered} istituti`];
  if (nFiltered !== data.length) parts.push(`di ${data.length}`);
  if (nFiltered > MAX_ROWS) parts.push(`mostrati ${MAX_ROWS} — restringi i filtri`);
  setStatus(parts.join(" · "));
  $("salva").disabled = data.length === 0;
}

function load(records) {
  data = records;
  sortKey = null;
  refreshFilters();
  render();
}

// ordinamento cliccando l'header
$("thead").addEventListener("click", (e) => {
  const k = e.target.dataset.k;
  if (!k) return;
  if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
  render();
});

// editing inline -> scrive nell'array per indice originale
function onEdit(e) {
  const t = e.target;
  if (t.dataset.i == null) return;
  const rec = data[t.dataset.i], k = t.dataset.c;
  if (t.type === "checkbox") rec[k] = t.checked;
  else if (t.tagName === "SELECT") {
    const col = COLUMNS.find((c) => c.k === k);
    rec[k] = col && col.parse ? col.parse(t.value) : (t.value === "" ? null : t.value);
  } else {
    rec[k] = t.value === "" ? null : t.value;
  }
}
$("tbody").addEventListener("input", onEdit);   // input di testo
$("tbody").addEventListener("change", onEdit);  // select

// i filtri client ridisegnano soltanto
["search", "fRegione", "fProvincia", "fLivello", "fTipo"].forEach(id =>
  $(id).addEventListener("input", render));
$("colonne").addEventListener("change", () => { showExtra = $("colonne").checked; render(); });

$("genera").addEventListener("click", async () => {
  const opts = {
    statali: $("statali").checked, paritarie: $("paritarie").checked,
    regione: $("regione").value, provincia: $("provincia").value.trim(),
    livello: $("livello").value, geocode: $("geocode").checked,
  };
  $("genera").disabled = true;
  setStatus(opts.geocode ? "Estrazione + geocoding in corso… può richiedere parecchi minuti."
                         : "Estrazione in corso…");
  try {
    const res = await fetch("/extract", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(opts),
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || "errore");
    load(j.records);
  } catch (err) {
    setStatus("Errore: " + err.message);
  } finally {
    $("genera").disabled = false;
  }
});

$("salva").addEventListener("click", async () => {
  $("salva").disabled = true;
  setStatus("Salvataggio…");
  try {
    const res = await fetch("/save", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data),
    });
    const j = await res.json();
    setStatus(res.ok ? `Salvati ${j.count} istituti in istituti.json` : "Errore: " + j.error);
  } finally {
    $("salva").disabled = false;
  }
});

// carica un eventuale JSON già generato
fetch("/istituti.json").then(r => r.json()).then(d => { if (d.length) load(d); });
</script>
